<div class="max-w-4xl mx-auto p-6 mt-20">
  <h1 class="text-5xl font-['Playfair_Display'] font-semibold text-[#2D2D2D] mb-4 tracking-tight">
    Generate Consumption Report
  </h1>
  <form [formGroup]="reportForm" (ngSubmit)="onSubmitGenerate()" class="bg-white p-6 rounded-2xl shadow-2xl border border-[#D4A017]/30">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div>
        <label for="startDate" class="block font-['Open_Sans'] text-[#2D2D2D] font-medium mb-1">Start Date</label>
        <p-calendar
          id="startDate"
          formControlName="startDate"
          [showIcon]="true"
          dateFormat="yy-mm-dd"
          class="w-full calendar-styled"
          inputStyleClass="border border-gray-300 rounded-lg p-3 w-full font-['Open_Sans'] text-[#2D2D2D] focus:border-[#D4A017] focus:ring-2 focus:ring-[#D4A017]/20"
        ></p-calendar>
        <div *ngIf="reportForm.get('startDate')?.touched && reportForm.get('startDate')?.invalid" class="max-w-[260px] bg-[#FFF5F5] border-l-4 border-[#EF4444] text-[#EF4444] p-4 rounded-lg shadow-sm text-sm -mt-2">
          Start date is required.
        </div>
      </div>
      <div>
        <label for="endDate" class="block font-['Open_Sans'] text-[#2D2D2D] font-medium mb-1">End Date</label>
        <p-calendar
          id="endDate"
          formControlName="endDate"
          [showIcon]="true"
          dateFormat="yy-mm-dd"
          class="w-full calendar-styled"
          inputStyleClass="border border-gray-300 rounded-lg p-3 w-full font-['Open_Sans'] text-[#2D2D2D] focus:border-[#D4A017] focus:ring-2 focus:ring-[#D4A017]/20"
        ></p-calendar>
        <div *ngIf="reportForm.get('endDate')?.touched && reportForm.get('endDate')?.invalid" class="max-w-[260px] bg-[#FFF5F5] border-l-4 border-[#EF4444] text-[#EF4444] p-4 rounded-lg shadow-sm text-sm -mt-2">
          End date is required.
        </div>
      </div>
    </div>
    <div class="mt-4">
      <label for="format" class="block font-['Open_Sans'] text-[#2D2D2D] font-medium mb-1">File Format</label>
      <p-dropdown
        id="format"
        formControlName="format"
        [options]="formatOptions"
        optionLabel="label"
        optionValue="value"
        class="w-full"
        styleClass="w-full border border-gray-300 rounded-lg font-['Open_Sans'] text-[#2D2D2D]"
        panelStyleClass="bg-white shadow-lg border border-[#D4A017]/30 rounded-lg"
        [style]="{'font-family': 'Open Sans, sans-serif'}"
      ></p-dropdown>
    </div>
    <div class="mt-8">
      <button
        type="submit"
        [disabled]="isLoading || reportForm.invalid"
        class="rounded-xl px-8 py-4 bg-gradient-to-r from-[#FFD580] to-[#D4A017] text-white shadow-lg hover:shadow-xl hover:scale-102 transition-all duration-300 ease-in-out disabled:opacity-50 font-['Open_Sans'] text-base"
      >
        <span *ngIf="!isLoading">Generate Report</span>
        <span *ngIf="isLoading">Generating…</span>
      </button>
    </div>
    <p *ngIf="errorMessage" class="bg-[#FFF5F5] border-l-4 border-[#EF4444] text-[#EF4444] p-4 rounded-lg shadow-sm text-sm mt-4 max-w-[260px]">{{ errorMessage }}</p>
  </form>
</div>
