<header class="top-nav fixed top-0 left-0 right-0 h-20 bg-gradient-to-r from-white/90 to-[#E0F7F1]/50 shadow-lg z-50 flex items-center justify-between px-12">
  <div class="logo text-3xl font-['Playfair_Display'] font-semibold text-[#6A9D8C]">
    NutriMatrix
  </div>
  <nav class="flex space-x-6">
    <a *ngIf="user" href="" class="text-base font-medium text-[#2D2D2D] hover:text-[#6A9D8C] transition-colors duration-300">App</a>
    <a href="" class="text-base font-medium text-[#2D2D2D] hover:text-[#6A9D8C] transition-colors duration-300">Features</a>
    <a href="" class="text-base font-medium text-[#2D2D2D] hover:text-[#6A9D8C] transition-colors duration-300">Testimonials</a>
    <a href="" class="text-base font-medium text-[#2D2D2D] hover:text-[#6A9D8C] transition-colors duration-300">Contact</a>
  </nav>
  <div class="flex items-center space-x-4">
    <a
      *ngIf="!user"
      href="/auth/login"
      class="rounded-xl px-6 py-3 bg-gradient-to-r from-[#FFD580] to-[#D4A017] text-white shadow-lg hover:shadow-xl hover:scale-105 transition-transform duration-300 ease-in-out"
    >
      Login
    </a>
    <ng-container *ngIf="user">
      <a
        [routerLink]="['/app/me']"
        class="text-base font-medium text-[#2D2D2D] hover:text-[#6A9D8C] transition-colors duration-300"
      >
        Hello, {{ user.name }}!
      </a>
      <button
        (click)="logout()"
        class="rounded-xl px-5 py-2 bg-[#EF4444] text-white font-medium shadow-md hover:bg-[#dc2626] hover:shadow-lg transition-all duration-300"
      >
        Log out
      </button>
    </ng-container>
  </div>

</header>
