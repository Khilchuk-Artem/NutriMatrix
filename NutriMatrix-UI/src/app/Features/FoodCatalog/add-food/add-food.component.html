<div class="mt-20 min-h-screen max-w-5xl mx-auto">
  <div class="p-8" [formGroup]="foodForm">
    <h1 class="text-5xl font-['Playfair_Display'] font-semibold text-[#2D2D2D] mb-8 tracking-tight">
      Add New Food
    </h1>

    <!-- Name -->
    <div class="mb-4">
      <input
        formControlName="name"
        [ngClass]="{
          'border-gray-200': name.valid || name.untouched,
          'border-[#EF4444]': name.invalid && !name.untouched
        }"
        class="w-full p-4 border rounded-xl font-['Open_Sans'] text-[#2D2D2D] placeholder:font-['Open_Sans'] placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-[#D4A017] transition-all duration-300"
        placeholder="Enter food name"
      />
      <div *ngIf="!name.untouched && name.invalid" class="bg-[#FFF5F5] border-l-4 border-[#EF4444] text-[#EF4444] p-4 rounded-lg shadow-sm text-sm mt-2 font-['Open_Sans']">
        <div *ngIf="name.errors?.['required']">Food name is required.</div>
      </div>
    </div>

    <!-- Photo URL -->
    <div class="mb-4">
      <input
        formControlName="photo"
        class="w-full p-4 border border-gray-200 rounded-xl font-['Open_Sans'] text-[#2D2D2D] placeholder:font-['Open_Sans'] placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-[#D4A017] transition-all duration-300"
        placeholder="Enter photo URL (optional)"
      />
    </div>

    <!-- Barcode -->
    <div class="mb-4">
      <input
        formControlName="barcode"
        class="w-full p-4 border border-gray-200 rounded-xl font-['Open_Sans'] text-[#2D2D2D] placeholder:font-['Open_Sans'] placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-[#D4A017] transition-all duration-300"
        placeholder="Enter barcode (optional)"
      />
    </div>

    <!-- Measures -->
    <div class="mb-4">
      <h2 class="text-2xl font-['Playfair_Display'] font-semibold text-[#2D2D2D] mb-4">Measures</h2>
      <div formArrayName="measures">
        <div *ngFor="let measure of measures.controls; let i = index" class="mb-2 flex items-center gap-2">
          <!-- Measure name input -->
          <input
            [formControl]="asFormControl(measure.get('name'))"
            class="w-full p-4 border border-gray-200 rounded-xl font-['Open_Sans'] text-[#2D2D2D] placeholder:font-['Open_Sans'] placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-[#D4A017] transition-all duration-300"
            placeholder="Enter measure name"
          />

          <!-- Weight input with unit -->
          <div class="relative flex items-center ">
            <input
              type="number"
              [formControl]="asFormControl(measure.get('weightInGrams'))"
              class="w-30 p-4 pr-10 border border-gray-200 rounded-xl font-['Open_Sans'] text-[#2D2D2D] placeholder:font-['Open_Sans'] placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-[#D4A017] transition-all duration-300"
              placeholder="Weight"
            />
            <span class="absolute right-3 text-sm text-gray-500">g</span>
          </div>

          <!-- Remove button -->
          <button
            type="button"
            [disabled]="i == 0"
            (click)="removeMeasure(i)"
            class="text-[#EF4444] hover:text-[#FF6666] transition-colors duration-300"
            [ngClass]="{'text-gray-400 hover:text-gray-400':i == 0}"

          >✕</button>
        </div>

      </div>
      <button type="button" (click)="addMeasure()" class="mt-2 p-2 bg-gradient-to-r from-[#FFD580] to-[#D4A017] text-white rounded-xl shadow-md hover:shadow-lg hover:scale-102 transition-all duration-300 font-['Open_Sans']">
        Add Measure
      </button>
    </div>

    <!-- Nutrients -->
    <section>
      <h2 class="text-2xl font-['Playfair_Display'] font-semibold text-[#2D2D2D] mb-4">Nutrients</h2>
      <div class="mb-6">
        <input
          type="text"
          formControlName="searchTerm"
          placeholder="Search nutrients..."
          class="w-full px-4 py-3 rounded-xl border border-[#D4A017]/40 focus:outline-none focus:ring-2 focus:ring-[#D4A017]/50 shadow-sm font-['Open_Sans'] text-[#2D2D2D] placeholder-gray-400 transition-all"
        />
      </div>
      <table class="w-full border-separate border-spacing-0 rounded-2xl shadow-lg bg-white border border-[#D4A017]/30">
        <thead>
        <tr>
          <th class="p-4 text-left font-medium border-b border-gray-200">Nutrient</th>
          <th class="p-4 text-right font-medium border-b border-gray-200">Amount (per 100g)</th>
        </tr>
        </thead>
        <tbody formArrayName="nutrients">
        <ng-container *ngFor="let group of groupedNutrients">
          <tr class="bg-gradient-to-r from-[#E0F7F1] to-[#D4A017]/20 border-y border-[#D4A017]/60 shadow-sm">
            <td colspan="2" class="p-4 text-lg font-semibold text-[#1F1F1F] font-['Playfair_Display']">
              {{ group.category }}
            </td>
          </tr>
          <tr *ngFor="let item of group.controls" [formGroupName]="item.index">
            <td class="p-4 border-b border-gray-200">
              {{ getNutrientLabel(item.control.get('nutrientId')?.value) }} ({{getNutrientUnits(item.control.get('nutrientId')?.value)}})
            </td>
            <td class="p-4 border-b border-gray-200 text-right">
              <input type="number" formControlName="amount" class="w-24 p-1 border border-gray-300 rounded text-right" />
            </td>
          </tr>
        </ng-container>
        </tbody>
      </table>
    </section>

    <!-- Submit Button -->
    <div class="mt-6 flex justify-end gap-4">
      <button
        type="button"
        (click)="onSubmit()"
        class="rounded-xl px-8 py-4 bg-gradient-to-r from-[#FFD580] to-[#D4A017] text-white shadow-lg hover:shadow-xl hover:scale-102 transition-all duration-300 ease-in-out"
        [disabled]="foodForm.invalid || saving"
      >
        {{ saving ? 'Saving...' : 'Add Food' }}
      </button>
    </div>
  </div>
</div>
