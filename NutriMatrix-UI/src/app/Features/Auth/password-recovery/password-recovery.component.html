<div class="flex items-center justify-center min-h-screen bg-[#F8FAF9] font-sans text-[#2D2D2D]">
  <div class="relative flex flex-col space-y-10 bg-white shadow-2xl rounded-2xl md:flex-row md:space-y-0 md:space-x-8 p-8 animate-reveal">
    <div class="flex flex-col space-y-6">
      <h2 class="font-serif text-4xl font-semibold tracking-tight text-center">Password Recovery</h2>
      <div class="w-full max-w-sm px-4">
        <p class="text-base leading-relaxed">
          Please, enter the email associated with your account and we'll send you a password reset link.
        </p>
      </div>

      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col space-y-4">
        <input
          type="email"
          formControlName="email"
          [disabled]="successMessage.length > 0"
          class="w-full p-3 border rounded-xl placeholder:font-sans placeholder:font-light focus:ring-2 focus:ring-[#6A9D8C]"
          [ngClass]="{
            'border-gray-300': emailControl?.valid || emailControl?.untouched,
            'border-[#EF4444]': emailControl?.invalid && !emailControl?.untouched
          }"
          placeholder="Enter your email address"
        />

        <div *ngIf="emailControl?.touched && emailControl?.invalid" class="bg-[#FFF5F5] border-l-4 border-[#EF4444] text-[#EF4444] p-4 rounded-lg shadow-sm">
          <div *ngIf="emailControl?.errors?.['required']">Email is required.</div>
          <div *ngIf="emailControl?.errors?.['email']">Enter a valid email address.</div>
        </div>

        <div *ngIf="successMessage; else formContent" class="bg-[#ECFDF5] border-l-4 border-[#10B981] text-[#065F46] p-4 rounded-lg shadow-sm">
          {{ successMessage }}
        </div>

        <ng-template #formContent>
          <div *ngIf="errorMessage" class="bg-[#FFF5F5] border-l-4 border-[#EF4444] text-[#EF4444] p-4 rounded-lg shadow-sm">
            {{ errorMessage }}
          </div>

          <div class="flex flex-col items-center justify-between space-y-6 md:flex-row md:space-y-0 md:space-x-4">
            <a
              href="/auth/login"
              class="w-full md:w-auto cursor-pointer flex justify-center items-center p-4 space-x-2 font-sans font-medium text-white rounded-xl bg-[#6A9D8C] shadow-lg hover:shadow-xl hover:scale-102 transition-all duration-300 ease-in-out"
            >
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 rotate-180" viewBox="0 0 24 24" stroke-width="1.5" stroke="#ffffff" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <path stroke="none" d="M0 0h24v24H0z" fill="none"></path>
                <line x1="5" y1="12" x2="19" y2="12"></line>
                <line x1="13" y1="18" x2="19" y2="12"></line>
                <line x1="13" y1="6" x2="19" y2="12"></line>
              </svg>
              <span>Back to login</span>
            </a>

            <button
              type="submit"
              class="w-full md:w-auto cursor-pointer flex justify-center items-center p-4 space-x-2 font-sans font-medium text-white rounded-xl bg-[#6A9D8C] shadow-lg hover:shadow-xl hover:scale-102 transition-all duration-300 ease-in-out"
            >
              <span>Submit</span>
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" stroke-width="1.5" stroke="#ffffff" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <path stroke="none" d="M0 0h24v24H0z" fill="none"></path>
                <line x1="5" y1="12" x2="19" y2="12"></line>
                <line x1="13" y1="18" x2="19" y2="12"></line>
                <line x1="13" y1="6" x2="19" y2="12"></line>
            </svg>
          </button>
        </div>
      </ng-template>
      </form>
    </div>
  </div>
</div>
