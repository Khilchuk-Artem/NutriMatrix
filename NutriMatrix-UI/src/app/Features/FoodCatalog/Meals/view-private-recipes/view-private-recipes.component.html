<div class="mt-20 max-w-7xl mx-auto">
  <h1 class="text-5xl font-['Playfair_Display'] font-semibold text-[#2D2D2D] mb-4 tracking-tight">
    My Recipes
  </h1>
  <!-- Add New Button and Search Bar -->
  <div class="mb-8 flex flex-row gap-4 items-center">
    <a
      (click)="onAddNew()"
      class="rounded-xl px-8 py-4 bg-gradient-to-r from-[#FFD580] to-[#D4A017] text-white shadow-lg hover:shadow-xl hover:scale-102 transition-all duration-300 ease-in-out"
      routerLink="/app/recipes/private/add"
    >
      + Add New
    </a>
    <div class="flex flex-row items-center w-full max-w-md">
      <input
        type="text"
        [(ngModel)]="searchQuery"
        (ngModelChange)="onSearch()"
        placeholder="Type name"
        class="w-full rounded-l-xl px-4 py-3 border border-[#D4A017]/30 focus:outline-none focus:ring-2 focus:ring-[#D4A017] font-['Open_Sans'] text-[#2D2D2D]"
      />
      <button
        (click)="onSearch()"
        class="rounded-r-xl px-4 py-3 bg-[#E0F7F1] border border-l-0 border-[#D4A017]/30 hover:bg-[#D4A017]/20 transition-all duration-300"
      >
        <svg
          class="h-5 w-5 stroke-[#D4A017]"
          fill="none"
          stroke-width="2"
          viewBox="0 0 24 24"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M21 21l-4.35-4.35m0 0a7.5 7.5 0 111.06-1.06l4.35 4.35z"
          ></path>
        </svg>
      </button>
    </div>
  </div>
  <!-- Recipe Table -->
  <div class="w-full">
    <table class="w-full border-separate border-spacing-0 rounded-2xl shadow-2xl bg-white border border-[#D4A017]/30">
      <thead>
      <tr>
        <th colspan="2" class="text-center p-5 text-base font-medium text-[#2D2D2D] font-['Open_Sans'] border-b border-gray-100">Recipes</th>
      </tr>
      </thead>
      <tbody>
      <ng-container *ngFor="let meal of meals; let i = index">
        <tr class="recipe-row hover:bg-[#E0F7F1]/30 transition-colors duration-300">
          <td class="p-5 border-b border-gray-100 text-[#2D2D2D] font-['Open_Sans'] capitalize">{{ meal.name }}</td>
          <td class="p-5 border-b border-gray-100 text-right">
            <div class="flex justify-end gap-2 items-center">
              <svg
                (click)="toggleRow(meal.id)"
                class="h-6 w-6 stroke-[#D4A017] transition-transform duration-300 cursor-pointer"
                [ngClass]="{'rotate-180': expandedRows[meal.id]}"
                fill="none"
                stroke-width="2"
                viewBox="0 0 24 24"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"></path>
              </svg>
            </div>
          </td>
        </tr>
        <tr *ngIf="expandedRows[meal.id]" class="bg-gray-100">
          <td colspan="2" class="p-5">
            <ng-container *ngIf="ingredients[meal.id]?.length; else loading">
              <div class="mb-4">
                <h3 class="text-base font-semibold text-[#2D2D2D] font-['Open_Sans']">
                  Ingredients for {{ meal.totalServings }} servings
                </h3>
                <ul class="mt-2 list-disc list-inside">
                  <li *ngFor="let ingredient of ingredients[meal.id]; let j = index" class="font-['Open_Sans'] text-[#2D2D2D]">
                    {{ ingredient.food.name }}: {{ getIngredientAmount(ingredient, meal.foodMeals[j], meal.totalServings) }} {{ ingredient.name }}
                  </li>
                </ul>
              </div>
              <button
                (click)="onViewMore(meal.id)"
                class="rounded-xl px-4 py-2 bg-gradient-to-r from-[#FFD580] to-[#D4A017] text-white font-['Open_Sans'] hover:shadow-md transition-all duration-300"
              >
                View More
              </button>
            </ng-container>
            <ng-template #loading>
              <div class="text-gray-500 font-['Open_Sans']">Loading ingredients...</div>
            </ng-template>
          </td>
        </tr>
      </ng-container>
      <tr *ngIf="!meals.length">
        <td colspan="2" class="p-5 text-center text-gray-400 font-['Open_Sans']">
          No recipes found.
        </td>
      </tr>
      </tbody>
    </table>
  </div>
</div>
