<div class="flex items-center justify-center min-h-screen" [formGroup]="resetForm">
  <div
    class="relative flex flex-col space-y-10 bg-white shadow-2xl rounded-2xl md:flex-row md:space-y-0 md:space-x-8 p-8 animate-reveal"
  >
    <div class="flex flex-col space-y-6 w-full max-w-md">
      <h2 class="font-serif text-4xl font-semibold tracking-tight">Reset Password</h2>
      <p class="text-base leading-relaxed">
        Enter your new password below to reset your account password.
      </p>

      <input
        type="password"
        formControlName="newPassword"
        [ngClass]="{
          'border-gray-300': newPassword?.valid || newPassword?.untouched,
          'border-[#EF4444]': newPassword?.invalid && !newPassword?.untouched
        }"
        class="w-full p-3 border rounded-xl placeholder:font-sans placeholder:font-light focus:ring-2 focus:ring-[#6A9D8C] transition-all duration-200"
        placeholder="Enter new password"
        autocomplete="new-password"
      />
      <div *ngIf="newPassword?.touched && newPassword?.invalid" class="bg-[#FFF5F5] border-l-4 border-[#EF4444] text-[#EF4444] p-4 rounded-lg shadow-sm text-sm -mt-2">
        <div *ngIf="newPassword?.errors?.['required']">New password is required.</div>
        <div *ngIf="newPassword?.errors?.['minlength']">Password must be at least 6 characters.</div>
      </div>

      <input
        type="password"
        formControlName="confirmNewPassword"
        [ngClass]="{
          'border-gray-300': confirmNewPassword?.valid || confirmNewPassword?.untouched,
          'border-[#EF4444]': (confirmNewPassword?.invalid && !confirmNewPassword?.untouched) || (resetForm.errors?.['notMatching'] && confirmNewPassword?.touched)
        }"
        class="w-full p-3 border rounded-xl placeholder:font-sans placeholder:font-light focus:ring-2 focus:ring-[#6A9D8C] transition-all duration-200"
        placeholder="Confirm new password"
        autocomplete="new-password"
      />
      <div *ngIf="confirmNewPassword?.touched && (confirmNewPassword?.invalid || resetForm.errors?.['notMatching'])" class="bg-[#FFF5F5] border-l-4 border-[#EF4444] text-[#EF4444] p-4 rounded-lg shadow-sm text-sm -mt-2">
        <div *ngIf="confirmNewPassword?.errors?.['required']">Please confirm your new password.</div>
        <div *ngIf="resetForm.errors?.['notMatching']">Passwords do not match.</div>
      </div>

      <div class="flex flex-col items-center justify-between space-y-6 md:flex-row md:space-y-0 md:space-x-4">
        <button
          (click)="onSubmit()"
          [disabled]="resetForm.invalid"
          class="w-full md:w-auto cursor-pointer flex justify-center items-center p-4 space-x-2 font-sans font-medium text-white rounded-xl bg-[#6A9D8C] shadow-lg hover:shadow-xl hover:scale-102 transition-all duration-300 ease-in-out disabled:opacity-60 disabled:cursor-not-allowed"
        >
          <span>Reset Password</span>
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-5 w-5"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="#ffffff"
            fill="none"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path stroke="none" d="M0 0h24v24H0z" fill="none"></path>
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <line x1="13" y1="18" x2="19" y2="12"></line>
            <line x1="13" y1="6" x2="19" y2="12"></line>
          </svg>
        </button>
      </div>

      <div *ngIf="errorMessage" class="text-sm text-error font-medium -mt-4">
        {{ errorMessage }}
      </div>

      <div *ngIf="successMessage" class="text-sm text-green-600 font-medium -mt-4">
        {{ successMessage }}
      </div>

      <p class="text-sm text-center text-gray-600">
        Remember your password?
        <a href="/auth/login" class="text-[#6A9D8C] hover:underline">Login here!</a>
      </p>
    </div>

    <img
      src="/assets/login-register-img.jpg"
      alt="Tracktopus with a bowl"
      class="w-[430px] mx-auto hidden md:block rounded-2xl"
    />

    <a
      href="/"
      class="absolute top-4 right-4 flex items-center justify-center h-10 w-10 bg-white rounded-full shadow-sm hover:shadow-md transition-all duration-300"
      aria-label="Close modal"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="h-6 w-6 stroke-[#D4A017]"
        viewBox="0 0 24 24"
        stroke-width="1.5"
        fill="none"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path stroke="none" d="M0 0h24v24H0z" fill="none"></path>
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </a>
  </div>
</div>
