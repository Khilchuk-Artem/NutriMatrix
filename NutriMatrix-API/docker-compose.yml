version: '3.4'

services:
  authdb:
    image: authdb

  foodcatalogdb:
    image: foodcatalogdb

  auth.api:
    image: ${DOCKER_REGISTRY-}authapi
    build:
      context: .
      dockerfile: Services/Auth/Auth.API/Dockerfile
    depends_on:
        - authdb

  foodcatalog.api:
    image: ${DOCKER_REGISTRY-}foodcatalogapi
    build:
      context: .
      dockerfile: Services/FoodCatalog/FoodCatalog.Api/Dockerfile
    depends_on:
        - foodcatalogdb
        - foodcatalogredis 
volumes:
  sql_data:
  postgres_foodcatalog:
  redis_data: